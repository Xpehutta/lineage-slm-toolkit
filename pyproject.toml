[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-defects"
version = "0.1.0"
description = "Defect operators, metrics and statistical protocol for measuring how training-data defects affect Data Lineage extraction models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lineage-defects = "lineage_defects.cli:main"

[tool.setuptools.packages.find]
include = ["lineage_defects*"]
