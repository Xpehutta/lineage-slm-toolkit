[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-slm-toolkit"
version = "0.1.0"
description = "Toolkit for Data Lineage extraction with compact language models: contour arbitration, prompting, QLoRA configuration, metrics and label-corruption operators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
parsers = ["sqlglot>=30,<31", "sqllineage>=1.5,<2"]

[project.scripts]
lineage-slm-toolkit = "lineage_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["lineage_toolkit*"]
